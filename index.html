<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Widget Sample</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #f2f6f9, #dbe9f4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-image: url('./banner-bg2.jpg');
    }

    button {
      padding: 12px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #btn-open-storage {
      position: absolute;
      top: 0%;
      right: 1%;
    }
  </style>
</head>
<body>

  <img src="./buddyAi_v1.jpeg" alt="Logo" style="width: 5%;position: absolute;top: 2%;left: 8%"/>
  <img src="./banner1.png" alt="Logo" style="width: 50%; height: 50%; "/>
  <button id="btn-open-storage" onclick="window.open('local-storage.html', '_blank')">Open Local Storage</button>
  <script src="chat-widget.js"></script>

  <script>
    localStorage.setItem('isLoggedIn', "true");
  
  </script>

</body>
</html>
