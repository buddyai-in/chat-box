<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 32px 28px 24px 28px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12), 0 1.5px 6px 0 rgba(0,0,0,0.04);
            border: 1px solid #e5e7eb;
        }
        .form-container h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .form-row {
            display: flex;
            gap: 18px;
            margin-bottom: 18px;
        }
        .form-group {
            flex: 1 1 0;
            margin-bottom: 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-size: 15px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            background: #f1f5f9;
            color: #1e293b;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px #6366f133;
            background: #fff;
        }
        button {
            background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 12px 0;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 2px 8px 0 rgba(99,102,241,0.08);
            transition: background 0.2s, box-shadow 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #4f46e5 0%, #6366f1 100%);
            box-shadow: 0 4px 16px 0 rgba(99,102,241,0.13);
        }
        @media (max-width: 700px) {
            .form-container {
                padding: 18px 6vw 16px 6vw;
                max-width: 98vw;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="form-container shadow-lg rounded-4 bg-white p-4 mx-auto" style="max-width: 540px;">
        <h2 class="mb-4 text-center fw-bold text-primary">User Information</h2>
        <form id="userForm">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="userId" class="form-label">User ID</label>
                    <input type="text" class="form-control" id="userId" required>
                </div>
                <div class="col-md-6">
                    <label for="userName" class="form-label">User Name</label>
                    <input type="text" class="form-control" id="userName" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="companyName" class="form-label">Company Name</label>
                    <input type="text" class="form-control" id="companyName" required>
                </div>
                <div class="col-md-6">
                    <label for="apiKey" class="form-label">API Key</label>
                    <input type="text" class="form-control" id="apiKey" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="documentId" class="form-label">Document ID</label>
                    <input type="text" class="form-control" id="documentId" required>
                </div>
                <div class="col-md-6">
                    <label for="sid" class="form-label">Secret Id</label>
                    <input type="text" class="form-control" id="sid" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="sKey" class="form-label">Secret Key</label>
                    <input type="text" class="form-control" id="sKey" required>
                </div>
                <div class="col-md-6">
                    <label for="token" class="form-label">Token</label>
                    <input type="text" class="form-control" id="token" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="roleId" class="form-label">Role Id</label>
                    <input type="text" class="form-control" id="roleId" required>
                </div>
                <div class="col-md-6">
                    <label for="location" class="form-label">GPS Location</label>
                    <input type="text" class="form-control" id="location" required>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="coordinates" class="form-label">GPS Coordinates</label>
                    <input type="text" class="form-control" id="coordinates" required>
                </div>
                <div class="col-md-6">
                    <label for="profile" class="form-label">Profile</label>
                    <select id="profile" class="form-select" required>
                        <option value="">Select environment</option>
                        <option value="uat">UAT</option>
                        <option value="dev">DEV</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Save Information</button>
        </form>
    </div>
</div>
<script>
    document.getElementById('userForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Get form values
        const userId = document.getElementById('userId').value;
        const userName = document.getElementById('userName').value;
        const apiKey = document.getElementById('apiKey').value;
        const documentId = document.getElementById('documentId').value;
        const sid = document.getElementById('sid').value;
        const sKey = document.getElementById('sKey').value;
        const token = document.getElementById('token').value;
        const profile = document.getElementById('profile').value;
        const company = document.getElementById('companyName').value;
        const roleId = document.getElementById('roleId').value;
        const location = document.getElementById('location').value;
        const coordinates = document.getElementById('coordinates').value;

        // Store in localStorage
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userId', userId);
        localStorage.setItem('bai-sk', apiKey);
        localStorage.setItem('userName', userName);
        localStorage.setItem('documentId', documentId);
        localStorage.setItem('sid', sid);
        localStorage.setItem('bai-sk', sKey);
        localStorage.setItem('jwt', token);
        localStorage.setItem('profile', profile);
        localStorage.setItem('company', company);
        localStorage.setItem('roleId', roleId);
        localStorage.setItem('location', location);
        localStorage.setItem('coordinates', coordinates);

        alert('Information saved successfully!');
    });

    function generateSessionId() {
        return Math.random().toString(36).substring(2, 15);
    }
</script>
</body>
</html>
