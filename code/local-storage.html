<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background: #FFFDF2;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 32px 28px 24px 28px;
            background: #FFFDF2;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.08), 0 1.5px 6px 0 rgba(0,0,0,0.06);
            border: 1.5px solid #e0e0e0;
        }
        .form-container h2 {
            text-align: center;
            color: #000000;
            margin-bottom: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            background: #FFFDF2;
            padding: 18px 0 14px 0;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 2px 8px 0 rgba(0,0,0,0.04);
            border-bottom: 1.5px solid #e0e0e0;
        }
        label, .form-label {
            color: #888888 !important;
            font-size: 15px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 7px;
            font-size: 15px;
            background: #fff;
            color: #888888;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #000000;
            box-shadow: 0 0 0 2px #00000022;
            background: #FFFDF2;
            color: #000000;
        }
        .btn-primary {
            background: #000000;
            color: #FFFDF2;
            border: none;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #222222;
            color: #FFFDF2;
        }
        .btn-outline-secondary {
            border-color: #000000;
            color: #000000;
        }
        .btn-outline-secondary:hover {
            background: #000000;
            color: #FFFDF2;
            border-color: #000000;
        }
        .btn-danger {
            background: #888888;
            border: none;
            color: #FFFDF2;
        }
        .btn-danger:hover {
            background: #000000;
            color: #FFFDF2;
        }
        .form-control::placeholder {
            color: #bbbbbb;
            opacity: 0.7;
        }
        @media (max-width: 700px) {
            .form-container {
                padding: 18px 6vw 16px 6vw;
                max-width: 98vw;
            }
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5" s>
    <div class="form-container shadow-lg rounded-4 bg-white p-4 mx-auto" style="max-width: 540px;">
        <h2 class="mb-4 text-center fw-bold text-primary">User Information</h2>
        <form id="userForm">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="userId" class="form-label">User ID</label>
                    <input type="text" class="form-control" id="userId" value="PS123" required>
                </div>
                <div class="col-md-6">
                    <label for="userName" class="form-label">User Name</label>
                    <input type="text" class="form-control" id="userName" value="PS123" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="companyName" class="form-label">Company Name</label>
                    <input type="text" class="form-control" id="companyName" value="Osource" required>
                </div>
                <div class="col-md-6">
                    <label for="apiKey" class="form-label">API Key</label>
                    <input type="text" class="form-control" id="apiKey" value="PS123" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="documentId" class="form-label">Document ID</label>
                    <input type="text" class="form-control" id="documentId" value="1" required>
                </div>
                <div class="col-md-6">
                    <label for="sid" class="form-label">Secret Id</label>
                    <input type="text" class="form-control" id="sid" value="PRqa55Js4bRqs-Vcj20HqA" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="sKey" class="form-label">Secret Key</label>
                    <input type="text" class="form-control" id="sKey" value="sk_7J-vQR2q56OUI-uG9p-KkwlA_1WoM0oKTUdWOxn8q9w" required>
                </div>
                <div class="col-md-6">
                    <label for="token" class="form-label">Token</label>
                    <input type="text" class="form-control" id="token" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="roleId" class="form-label">Role Id</label>
                    <input type="text" class="form-control" id="roleId" value="1" required>
                </div>
                <div class="col-md-6">
                    <label for="location" class="form-label">GPS Location</label>
                    <input type="text" class="form-control" id="location" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-12">
                    <label for="apiBaseUrl" class="form-label">Base URL (optional)</label>
                    <input type="url" class="form-control" id="apiBaseUrl" value="https://13.232.238.31/" placeholder="https://13.232.238.31/v2/api">
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="coordinates" class="form-label">GPS Coordinates</label>
                    <input type="text" class="form-control" id="coordinates" required>
                </div>
                <div class="col-md-6">
                    <label for="profile" class="form-label">Profile</label>
                    <select id="profile" class="form-select">
                        <option value="">Select environment</option>
                        <option value="uat">UAT</option>
                        <option value="dev">DEV</option>
                    </select>
                </div>
            </div>
            <div id="dynamicFields"></div>
            <div class="d-flex justify-content-end mb-3">
                <button type="button" class="btn btn-outline-secondary" id="addFieldBtn">+ Add Field</button>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Save Information</button>
        </form>
    </div>
</div>
<script>
    // Dynamic field logic
    let dynamicFieldCount = 0;
    document.getElementById('addFieldBtn').addEventListener('click', function() {
        dynamicFieldCount++;
        const dynamicFields = document.getElementById('dynamicFields');
        const fieldId = `dynamicField${dynamicFieldCount}`;
        const labelId = `dynamicLabel${dynamicFieldCount}`;
        const row = document.createElement('div');
        row.className = 'row g-3 mb-3 align-items-end';
        row.innerHTML = `
            <div class="col-md-5">
                <input type="text" class="form-control" placeholder="Field Name" id="${labelId}" required>
            </div>
            <div class="col-md-5">
                <input type="text" class="form-control" placeholder="Field Value" id="${fieldId}" required>
            </div>
            <div class="col-md-2 text-end">
                <button type="button" class="btn btn-danger btn-sm remove-field">Remove</button>
            </div>
        `;
        dynamicFields.appendChild(row);
        row.querySelector('.remove-field').addEventListener('click', function() {
            row.remove();
        });
    });

    const profileSelect = document.getElementById('profile');
    const apiBaseUrlInput = document.getElementById('apiBaseUrl');

    function syncBaseUrlProfileState() {
        const hasBaseUrl = apiBaseUrlInput.value.trim() !== '';
        if (hasBaseUrl) {
            profileSelect.value = '';
            profileSelect.disabled = true;
        } else {
            profileSelect.disabled = false;
        }
    }

    apiBaseUrlInput.addEventListener('input', function() {
        syncBaseUrlProfileState();
    });

    profileSelect.addEventListener('change', function() {
        if (profileSelect.value) {
            apiBaseUrlInput.value = '';
        }
        profileSelect.disabled = false;
    });

    syncBaseUrlProfileState();

    document.getElementById('userForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Get form values
        const userId = document.getElementById('userId').value;
        const userName = document.getElementById('userName').value;
        const apiKey = document.getElementById('apiKey').value;
        const documentId = document.getElementById('documentId').value;
        const sid = document.getElementById('sid').value;
        const sKey = document.getElementById('sKey').value;
        const token = document.getElementById('token').value;
        const profile = document.getElementById('profile').value;
        const apiBaseUrl = document.getElementById('apiBaseUrl').value.trim();
        const company = document.getElementById('companyName').value;
        const roleId = document.getElementById('roleId').value;
        const location = document.getElementById('location').value;
        const coordinates = document.getElementById('coordinates').value;

        if (apiBaseUrl !== '' && profile !== '') {
            alert('Use either Base URL or Profile. If Base URL is filled, Profile must be empty.');
            return;
        }

        if (apiBaseUrl === '' && profile === '') {
            alert('Please provide either Base URL or Profile.');
            return;
        }

        // Store in localStorage
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userId', userId);
        localStorage.setItem('bai-sk', apiKey);
        localStorage.setItem('userName', userName);
        localStorage.setItem('documentId', documentId);
        localStorage.setItem('sid', sid);
        localStorage.setItem('bai-sk', sKey);
        localStorage.setItem('jwt', token);
        if (apiBaseUrl !== '') {
            localStorage.setItem('apiBaseUrl', apiBaseUrl);
            localStorage.setItem('dbApiBaseUrl', apiBaseUrl);
            localStorage.setItem('profile', '');
        } else {
            localStorage.removeItem('apiBaseUrl');
            localStorage.removeItem('dbApiBaseUrl');
            localStorage.setItem('profile', profile);
        }
        localStorage.setItem('company', company);
        localStorage.setItem('roleId', roleId);
        localStorage.setItem('location', location);
        localStorage.setItem('coordinates', coordinates);

        // Save dynamic fields to localStorage
        const dynamicFields = document.getElementById('dynamicFields').querySelectorAll('.row');
        dynamicFields.forEach(row => {
            const key = row.querySelector('input[placeholder="Field Name"]').value;
            const value = row.querySelector('input[placeholder="Field Value"]').value;
            if(key) {
                localStorage.setItem(key, value);
            }
        });
        alert('Information saved successfully!');
    });

    function generateSessionId() {
        return Math.random().toString(36).substring(2, 15);
    }
</script>
</body>
</html>
